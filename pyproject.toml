[project]
name = "biped-rl"
version = "0.1.0"
description = "Parametric ~30 cm biped in MuJoCo, trained with RL"
requires-python = ">=3.11,<3.13"
dependencies = [
    "mujoco>=3.2",
    "numpy",
    "pyyaml",
    "matplotlib",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# Not a library: code runs from the repo root, so install only the dependencies.
[tool.setuptools]
packages = []
